name: Submit a case
description: Share a real-world Memex development for the showcase
title: "[Case] <your title>"
labels: ["showcase", "case-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Memex development! A maintainer will turn this into an
        entry in `cases.json`. Please keep it honest and concrete — no unverifiable claims
        and no private data. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: input
    id: title
    attributes:
      label: Title
      description: Short and specific, not marketing.
      placeholder: e.g. Climate-policy research vault with strict provenance
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Your name or @handle.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link (optional)
      description: A write-up, repo, or thread readers can follow.
      placeholder: https://…
    validations:
      required: false
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Africa
        - Americas
        - Asia
        - Europe
        - Middle East
        - Oceania
    validations:
      required: true
  - type: input
    id: categories
    attributes:
      label: Categories
      description: Comma-separated tags. Reuse existing ones where they fit.
      placeholder: Research synthesis, Governance
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 1–3 sentences — what you built and why it matters.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: This describes something actually built (no unverifiable claims).
          required: true
        - label: It contains no private data, secrets, or anyone's information without consent.
          required: true
